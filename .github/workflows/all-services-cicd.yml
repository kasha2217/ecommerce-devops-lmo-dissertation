iname: All Services CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
  pull_request:
    branches: [ main ]

env:
  DOCKER_USERNAME: dockanika

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: product-catalog
            language: go
          - name: recommendationservice
            language: python
          - name: cartservice
            language: dotnet
          - name: frontend
            language: node
          - name: checkoutservice
            language: go
          - name: paymentservice
            language: node
          - name: shippingservice
            language: go
          - name: emailservice
            language: python
          - name: accountingservice
            language: go
          - name: adservice
            language: java
          - name: currencyservice
            language: node
          - name: quoteservice
            language: php
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.service.name }}
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service.name }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Image built
        run: echo "✅ Built ${{ matrix.service.name }}"

  deploy-all:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy All Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ultimate-devops-project-demo
            echo "🚀 Pulling all updated images..."
            docker compose pull
            echo "🔄 Restarting all services..."
            docker compose up -d
            echo "✅ All services deployed!"
            docker compose ps
