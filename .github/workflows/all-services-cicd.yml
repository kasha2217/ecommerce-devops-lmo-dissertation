name: All Microservices CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
  workflow_dispatch:

env:
  DOCKER_USERNAME: dockanika

jobs:
  build-all-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - product-catalog
          - recommendationservice
          - cartservice
          - checkoutservice
          - paymentservice
          - shippingservice
          - emailservice
          - currencyservice
          - frontend
          - adservice
          - accountingservice
          - quoteservice
          - frauddetectionservice
          - imageprovider
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.service }}
          file: src/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
        continue-on-error: true
      
      - name: Build completed
        run: echo "✅ ${{ matrix.service }} processed"

  deploy-all:
    name: Deploy All Services
    runs-on: ubuntu-latest
    needs: build-all-services
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ultimate-devops-project-demo
            docker compose pull
            docker compose up -d
            docker compose ps
            echo "✅ All services deployed!"
